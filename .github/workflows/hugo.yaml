name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Decode binary assets (link-in-bio page at /links/)
        run: |
          if [ -d static ]; then
            # Reassemble split base64 parts (foo.bin.b64.partaa, partab, ...) into foo.bin.b64
            find static -name '*.b64.partaa' -print0 | while IFS= read -r -d '' f; do
              base="${f%.b64.partaa}"
              cat "${base}.b64.part"* > "${base}.b64"
              rm -f "${base}.b64.part"*
            done
            find static -name '*.b64' -print0 | while IFS= read -r -d '' f; do
              base64 -d "$f" > "${f%.b64}" && rm "$f"
            done
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.3"
          extended: true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
