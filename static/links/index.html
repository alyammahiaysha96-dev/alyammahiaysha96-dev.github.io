.card{position:relative;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid #ecdcd0;border-radius:18px;padding:12px;box-shadow:0 2px 10px rgba(101,21,56,.08);text-decoration:none;color:inherit;transition:transform .15s}

.info{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;line-height:1.25}
.sub{font-size:13px;color:var(--muted);margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.price{font-weight:800;font-size:18px;color:var(--b)}
.was{font-weight:600;font-size:14px;color:var(--muted);text-decoration:line-through;margin-right:6px}
.btn{display:inline-block;background:var(--b);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:999px;min-height:44px;white-space:nowrap}
.badge{position:absolute;top:-8px;left:-6px;background:#c8102e;color:#fff;font-size:12px;font-weight:800;letter-spacing:.6px;padding:4px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.18)}

<script>
/* ==== TO ADD A PRODUCT: copy one { ... } block below, edit it, keep the commas.
   Order on the page = order in this list. shop:true uses the Shopify sale. ==== */
const PRODUCTS = [
  { name: "Ultimate Finance Bundle", sub: "Budget, debt payoff & savings spreadsheets", price: 29.99,
    link: "https://ycu9g1-xy.myshopify.com/products/ultimate-finance-bundle-budget-debt-payoff-savings-spreadsheets-for-google-sheets-excel", img: "img/ultimate-finance-bundle.jpg", shop: true },
  { name: "Savings Challenge Pack", sub: "18 printable pages · 12 color-in savings trackers", price: 6,
    link: "https://ycu9g1-xy.myshopify.com/products/savings-challenge-pack-12-color-in-savings-trackers", img: "img/savings-challenge-pack.jpg", shop: true },
  { name: "Christmas Budget & Gift List Planner 2026", sub: "29 printable pages · budget & gift list", price: 7,
    link: "https://ycu9g1-xy.myshopify.com/products/christmas-budget-gift-list-planner-2026", img: "img/christmas-budget.jpg", shop: true },
  { name: "Monthly Bill Tracker 2027", sub: "Never miss a due date: 12 monthly trackers + subscription audit", price: 6,
    link: "https://ycu9g1-xy.myshopify.com/products/monthly-bill-tracker-2027", img: "img/bill-tracker.jpg", shop: true },
  { name: "2027 Money Reset Planner", sub: "47 printable pages · budget, debt & savings reset", price: 14.99,
    link: "https://ycu9g1-xy.myshopify.com/products/2027-budget-planner-printable-money-reset-planner-annual-budget-debt-payoff-savings-challenges-monthly-finance-tracker-pdf", img: "img/2027-money-reset.jpg", shop: true },
  { name: "Paycheck Budget Planner", sub: "Google Sheets & Excel · budget by paycheck", price: 14.99,
    link: "https://ycu9g1-xy.myshopify.com/products/paycheck-budget-planner-spreadsheet-2027-google-sheets-excel-budget-template", img: "img/paycheck-budget.jpg", shop: true },
  { name: "Debt Snowball & Avalanche Planner", sub: "Google Sheets & Excel · see your debt-free date", price: 12.99,
    link: "https://ycu9g1-xy.myshopify.com/products/debt-snowball-avalanche-spreadsheet-debt-payoff-planner-for-google-sheets-excel", img: "img/debt-snowball.jpg", shop: true },
  { name: "Savings Tracker Spreadsheet", sub: "Sinking funds & emergency fund tracker", price: 9.99,
    link: "https://ycu9g1-xy.myshopify.com/products/savings-tracker-spreadsheet-sinking-funds-emergency-fund-tracker-for-google-sheets-excel", img: "img/savings-tracker.jpg", shop: true },
  { name: "Pink Kawaii Study Girl Kit", sub: "48 stickers, study planner & wallpapers", price: 2.99,
    link: "https://buy.stripe.com/8x2bJ00ys6HH8JN47d0ZW00", img: "img/kawaii-study-kit.jpg", shop: false }
];

const dubaiDate = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dubai", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const today = dubaiDate();
const BF_ON = today >= "2026-11-20" && today <= "2026-12-03";
const BF_SOON = today < "2026-11-20";
const money = n => (Number.isInteger(n) ? "$" + n : "$" + n.toFixed(2));
const salePrice = n => Math.round(n * 0.7 * 100) / 100;

const banner = document.getElementById("bf-banner");
if (BF_ON) {
  banner.textContent = "Black Friday: 30% off shop products through December 3";
  banner.classList.add("on");
} else if (BF_SOON) {
  banner.textContent = "Black Friday: 30% off shop products, November 20–December 3";
  banner.classList.add("on");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("products").innerHTML = PRODUCTS.map((p, i) => {
  const onSale = BF_ON && p.shop;
  const priceHtml = onSale
    ? `<span class="was">${esc(money(p.price))}</span><span class="price">${esc(money(salePrice(p.price)))}</span>`
    : `<span class="price">${esc(money(p.price))}</span>`;
  const badge = onSale ? "30% OFF" : (p.badge || "");
  return `
  <a class="card" href="${esc(p.link)}" rel="noopener">
    ${badge ? `<span class="badge">${esc(badge)}</span>` : ""}
    <div class="thumb"><img src="${esc(p.img)}" alt="${esc(p.name)}" width="108" height="128" ${i > 1 ? 'loading="lazy"' : ""}></div>
    <div class="info">
      <div class="name">${esc(p.name)}</div>
      ${p.sub ? `<div class="sub">${esc(p.sub)}</div>` : ""}
      <div class="row"><span>${priceHtml}</span><span class="btn">Get it</span></div>
    </div>
  </a>`;
}).join("");
document.getElementById("y").textContent = new Date().getFullYear();
</script>
