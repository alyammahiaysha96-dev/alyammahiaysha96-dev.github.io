*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--cream);

}
.wrap{max-width:1240px;margin:0 auto;padding:48px 20px 80px}
header{text-align:center;margin-bottom:48px}
.mark{

}
h1{

  margin-bottom:14px;
}
.note{
  color:var(--muted);
  font-size:1.05rem;
  max-width:36em;
  margin:0 auto;
}
#gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:28px 22px;
}
.card{
  background:var(--card);
  border:1px solid rgba(201,164,92,.28);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(101,21,56,.05);
}
.card a{display:block;background:#efe6d8}
.card img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:5/6;
  object-fit:cover;
  vertical-align:middle;
}
.card figcaption{
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:1.05rem;
  font-weight:600;
  color:var(--burgundy);
  padding:14px 16px 16px;
  line-height:1.35;
}
.lb{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.lb:target{display:flex}
.lb-bg{
  position:absolute;inset:0;
  background:rgba(43,26,32,.78);
}
.lb figure{
  position:relative;
  z-index:1;
  max-width:min(900px, 100%);
  max-height:100%;
  background:var(--card);
  border-radius:8px;
  border:1px solid var(--gold);
  overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.lb img{
  display:block;
  max-width:100%;
  max-height:78vh;
  width:auto;
  height:auto;
  margin:0 auto;
}
.lb figcaption{
  font-family:"Cormorant Garamond", Georgia, serif;
  color:var(--burgundy);
  font-weight:600;
  padding:12px 20px 4px;
  text-align:center;
}
.lb-x{
  display:block;
  text-align:center;
  color:var(--gold);
  text-decoration:none;
  font-size:.85rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:8px 16px 16px;
  font-weight:500;
}
.lb-x:hover{color:var(--burgundy)}
footer{
  margin-top:64px;
  text-align:center;
  color:var(--muted);
  font-size:.85rem;
}
footer .rule{
  display:block;
  width:40px;height:1px;
  background:var(--gold);
  margin:0 auto 16px;
}
footer .designer-id{

  margin-top:10px;
